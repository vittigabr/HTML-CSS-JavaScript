<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Clima</title>
</head>
<body>
    <div class="display">
        <h1>Previsão Do Tempo</h1>
        <p>Digite o nome de uma cidade para consultar o clima atual</p>
        <div class="inserirDados">
            <input type="text" name="" id="cidade" placeholder="Digite o nome da sua cidade">
            <button id="buscar">Buscar</button>
        </div>
    

        <h2 id="nomeCidade">
            Cidade
        </h2>
        <div class="visualizacaoDados">
            <div class="primeiroBloco bloco">
                <h2><img src="assets/thermometer.png" alt="">Temperatura</h2>
                <p class="temperatura">
                    <span class="temperaturaMinima"><span id="temperaturaMin">--</span> °C</span>
                    <sapn class="temperaturaMaxima"><span id="temperaturaMax">--</span> °C</sapn>
                </p>
                <h2><img src="assets/wind.png" alt="">Vento</h2>
                <p>
                    <span id="vento">--</span>km/h
                </p>
            </div>
            <div class="segundoBloco bloco">
                <h2><img src="assets/thermometer.png" alt="">Sensação térmica</h2>
                <p>
                    <span id="sensacao">--</span>°C
                </p>
                <h2><img src="assets/wind-arrow-down.png" alt="">Rajada de Vento</h2>
                <p>
                    <span id="rajada">--</span>km/h
                </p>
            </div>
            <div class="terceiroBloco bloco">
                <h2><img src="assets/cloud-rain-wind.png" alt="">Chuva</h2>
                <p>
                    <span id="chuvaMM">--</span>mm
                </p>
                <h2><img src="assets/sun.png" alt="">Sol</h2>
                <p>
                    <span id="horaSunRise">--</span>:<span id="minutoSunRise">--</span> às
                    <span id="horaSunSet">--</span>:<span id="minutoSunSet">--</span>
                </p>
            </div>
            <div class="quartoBloco bloco">
                <h2><img src="assets/droplet.png" alt="">Umidade do Ar</h2>
                <p>
                    <span id="umidade">--</span>%
                </p>
            </div>
        </div>
        <div class="chart">
            <canvas id="graficoTemperatura"></canvas>
            <canvas id="graficoChuva"></canvas>
        </div>
    </div>

    <script type="module" src="tabela.js"></script>  
    <script type="module" src="grafico.js"></script>  
</body>
</html>
